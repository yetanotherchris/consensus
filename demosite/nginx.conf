worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cloud Run terminates the client connection before requests reach this
    # container, so $remote_addr would rate-limit every visitor together.
    map $http_x_forwarded_for $consensus_client_ip {
        ~^(?<forwarded_client_ip>[^,[:space:]]+) $forwarded_client_ip;
        default $remote_addr;
    }

    # Three requests per minute permits one request every 20 seconds per client IP.
    limit_req_zone $consensus_client_ip zone=consensus_start:10m rate=3r/m;

    server {
        listen 8080;
        server_name _;

        location = /api/consensus/start {
            limit_req zone=consensus_start;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
